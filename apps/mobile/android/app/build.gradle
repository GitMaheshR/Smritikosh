apply plugin: 'com.android.application'

// Release signing. The keystore lives outside the project (Documents\Smritikosh-license) and its password is
// handed over only for the build, through SMRITIKOSH_KEYSTORE_PASSWORD (scripts/build-release.ps1 asks for it in a
// pop-up and never saves it). The certificate's SHA-256 fingerprint is built into the release so the app can tell a
// re-signed (modified) copy apart (IntegrityCheck.java).
def releaseKeystore = file(System.getenv('SMRITIKOSH_KEYSTORE') ?: "${System.getProperty('user.home')}/Documents/Smritikosh-license/smritikosh-release.jks")
def releasePassword = System.getenv('SMRITIKOSH_KEYSTORE_PASSWORD')
def releaseAlias = 'smritikosh'
def releaseCertSha256 = ''
if (releasePassword && releaseKeystore.exists()) {
    def ks = java.security.KeyStore.getInstance('PKCS12')
    releaseKeystore.withInputStream { ks.load(it, releasePassword.toCharArray()) }
    def cert = ks.getCertificate(releaseAlias)
    releaseCertSha256 = java.security.MessageDigest.getInstance('SHA-256').digest(cert.encoded).encodeHex().toString().toUpperCase()
}

android {
    namespace "app.smritikosh.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            if (releaseCertSha256) {
                storeFile releaseKeystore
                storePassword releasePassword
                keyAlias releaseAlias
                keyPassword releasePassword
            }
        }
    }
    defaultConfig {
        applicationId "app.smritikosh.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            buildConfigField "String", "SIGNING_CERT_SHA256", '""'
        }
        release {
            // Android code shrinking (R8) stays off until a release build has been tried on a real phone:
            // wrong keep rules only show up as a crash at runtime.
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            buildConfigField "String", "SIGNING_CERT_SHA256", "\"${releaseCertSha256}\""
        }
    }
}

// A release built without the keystore password would be unsigned and unchecked: refuse.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && !releaseCertSha256) {
        throw new GradleException('Release builds need the Smritikosh keystore. Run: pnpm apk:release')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
